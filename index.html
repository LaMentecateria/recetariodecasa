<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetario de casa</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #333;
            --accent: #000;
            --grey: #999;
            --light-grey: #f4f4f4;
            --highlight: #fff5ad; /* Color del subrayado */
        }

        body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
        
        header { 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 60px 20px 20px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .brand-container { cursor: pointer; }
        header h1 { font-size: 32px; font-weight: 200; letter-spacing: -1px; margin: 0; }
        header p { margin: 5px 0 0 0; font-size: 12px; color: var(--grey); text-transform: uppercase; letter-spacing: 2px; }

        .search-container { position: relative; }
        .search-input {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 16px; 
            outline: none;
            width: 200px;
            transition: all 0.3s;
            -webkit-appearance: none;
            box-sizing: border-box;
        }
        .search-input:focus { width: 250px; border-color: var(--accent); }

        .search-results-list {
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            width: 250px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            z-index: 100;
            display: none;
            margin-top: 5px;
        }
        .search-item {
            padding: 12px 15px;
            border-bottom: 1px solid #f9f9f9;
            cursor: pointer;
            font-size: 14px;
            display: block;
            color: var(--text);
            text-decoration: none;
        }
        .search-item:last-child { border-bottom: none; }
        .search-item:hover { background: var(--light-grey); }
        .search-item strong { display: block; color: var(--accent); }

        /* Contenedor de Categorías con Scroll Lateral Eficiente */
        .categories-container {
            max-width: 1000px;
            margin: 0 auto 40px auto;
            padding: 0 20px;
            display: flex;
            gap: 10px;
            flex-wrap: nowrap; 
            overflow-x: auto; 
            scrollbar-width: none; 
            -webkit-overflow-scrolling: touch; 
        }
        
        .categories-container::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            background: none;
            border: 1px solid #eee;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #666;
            white-space: nowrap; 
        }
        .category-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .category-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

        .recipe-grid-home { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; padding-bottom: 60px; }
        .recipe-card { border: 1px solid #eee; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; background: #fff; }
        .recipe-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        
        .recipe-card-img { width: 100%; height: 200px; object-fit: cover; border-bottom: 1px solid #eee; }
        .recipe-card-info { padding: 20px; }
        .recipe-card-info h2 { font-size: 20px; margin: 0 0 10px; color: #111; }
        .recipe-card-info .meta { font-size: 11px; color: var(--grey); text-transform: uppercase; letter-spacing: 1px; }
        
        /* Ajuste para que las etiquetas múltiples se separen si hay más de una */
        .recipe-card-info .category-tag { font-size: 10px; color: var(--grey); background: var(--light-grey); padding: 2px 8px; border-radius: 10px; display: inline-block; margin-top: 8px; margin-right: 5px; }

        #recipe-detail { display: none; padding-bottom: 100px; }
        
        /* Ajustes de la barra de navegación del detalle */
        .detail-nav-bar {
            position: relative;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .back-btn { 
            background: var(--accent); 
            border: 1px solid var(--accent); 
            padding: 10px 25px; 
            border-radius: 20px;
            cursor: pointer; 
            font-size: 13px; 
            color: #fff;
            transition: opacity 0.2s ease;
            outline: none;
            -webkit-appearance: none;
            font-weight: 500;
            white-space: nowrap;
        }
        .back-btn:hover { 
            opacity: 0.8;
        }

        /* Modificado para que crezca y ocupe todo el espacio a la derecha */
        .detail-search-container {
            position: relative;
            flex-grow: 1;
        }
        
        .detail-search-container .search-input {
            width: 100%;
        }
        .detail-search-container .search-input:focus {
            width: 100%;
        }

        .detail-header h2 { font-size: 42px; font-weight: 700; margin: 0 0 10px; letter-spacing: -1px; }
        .detail-meta { font-size: 13px; color: var(--grey); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 40px; }
        
        .servings-selector { margin-bottom: 20px; font-size: 14px; font-weight: bold; }
        .servings-selector input { width: 50px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; margin-left: 10px; }

        .video-box { position: relative; padding-bottom: 56.25%; height: 0; background: #000; margin-bottom: 50px; }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .content-split { display: flex; flex-wrap: wrap; gap: 60px; }
        .ingredients { flex: 0 0 240px; }
        .instructions { flex: 1 1 300px; }

        h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #ccc; margin-bottom: 25px; }
        ul, ol { padding: 0; list-style: none; margin: 0; }
        .ingredients li { font-size: 16px; padding: 10px 0; border-bottom: 1px solid #f2f2f2; }
        
        ol { counter-reset: steps; }
        ol li { position: relative; padding-left: 45px; margin-bottom: 30px; font-size: 18px; line-height: 1.6; transition: background 0.3s; }
        
        ol li.done { background-color: var(--highlight); border-radius: 4px; }

        ol li::before { 
            content: counter(steps); counter-increment: steps;
            position: absolute; left: 0; top: 4px;
            width: 24px; height: 24px; background: #000; color: #fff;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: bold; cursor: pointer;
        }

        .step-img {
            width: 100%;
            max-width: 450px;
            border-radius: 8px;
            margin: 15px 0 10px 0;
            display: block;
            border: 1px solid #eee;
        }

        @media (max-width: 600px) { 
            .content-split { flex-direction: column; } 
            header { text-align: center; justify-content: center; padding: 40px 20px 10px 20px; }
            .search-results-list { width: calc(100vw - 40px); right: -10px; left: -10px; margin: 5px auto; }
            .categories-container { margin-bottom: 25px; padding: 0 15px; }
            
            /* Alineación y comportamiento adaptado de la barra y lista en móviles */
            .detail-nav-bar { gap: 10px; }
            #detail-quick-results {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                width: 100%;
                margin: 5px 0 0 0;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="brand-container" onclick="showHome()">
        <h1>Recetario de casa</h1>
        <p>Nuestra historia a fuego lento</p>
    </div>
    <div class="search-container" id="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar ingrediente o receta..." onkeyup="filterRecipes()" autocomplete="off">
        <div id="quick-results" class="search-results-list"></div>
    </div>
</header>

<div class="categories-container" id="categories-box">
    <button class="category-btn active" onclick="filterByCategory('Todas', this)">Todas</button>
    <button class="category-btn" onclick="filterByCategory('Valencia', this)">Gastronomía valenciana</button>
    <button class="category-btn" onclick="filterByCategory('Marruecos', this)">Gastronomía marroquí</button>
    <button class="category-btn" onclick="filterByCategory('Ensalada', this)">Ensaladas</button>
    <button class="category-btn" onclick="filterByCategory('Picoteo', this)">Picoteo</button>
    <button class="category-btn" onclick="filterByCategory('Pasta', this)">Pasta</button>
    <button class="category-btn" onclick="filterByCategory('Vegetariano', this)">Vegetariano</button>
</div>

<div class="container">
    <div id="home-view" class="recipe-grid-home"></div>
    <div id="recipe-detail">
        <div class="detail-nav-bar">
            <button class="back-btn" onclick="showHome()">← Volver</button>
            <div class="detail-search-container" id="detail-search-box">
                <input type="text" id="detailSearchInput" class="search-input" placeholder="Buscar otra receta..." onkeyup="filterRecipesDetail()" autocomplete="off">
                <div id="detail-quick-results" class="search-results-list"></div>
            </div>
        </div>
        <div id="detail-content"></div>
    </div>
</div>

    let wakeLock = null;
    let categoriaActual = 'Todas'; 

    async function toggleWakeLock(activate) {
        if (!('wakeLock' in navigator)) return;
        try {
            if (activate) {
                wakeLock = await navigator.wakeLock.request('screen');
            } else if (wakeLock) {
                await wakeLock.release();
                wakeLock = null;
            }
        } catch (err) {
            console.error(`${err.name}, ${err.message}`);
        }
    }

    function showHome() {
        toggleWakeLock(false); 
        document.getElementById('home-view').style.display = 'grid';
        document.getElementById('recipe-detail').style.display = 'none';
        document.getElementById('search-box').style.display = 'block';
        document.getElementById('categories-box').style.display = 'flex'; 
        document.getElementById('quick-results').style.display = 'none';
        document.getElementById('detail-quick-results').style.display = 'none';
        document.getElementById('searchInput').value = '';
        document.getElementById('detailSearchInput').value = '';
        aplicarFiltrosYBusqueda();
    }

    function renderHome(listaRecetas) {
        const homeView = document.getElementById('home-view');
        if (listaRecetas.length === 0) {
            homeView.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #999; padding: 40px;">No se encontraron recetas en esta categoría.</div>';
            return;
        }
        homeView.innerHTML = listaRecetas.map(r => {
            const tagsHTML = r.categoria.map(cat => `<span class="category-tag">${cat}</span>`).join('');
            return `
                <div class="recipe-card" onclick="showRecipe(${r.id})">
                    <img src="${r.imagen}" class="recipe-card-img" alt="${r.titulo}">
                    <div class="recipe-card-info">
                        <div class="meta">${r.meta}</div>
                        <h2>${r.titulo}</h2>
                        <div>${tagsHTML}</div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function filterByCategory(categoria, elemento) {
        categoriaActual = categoria;
        
        const botones = document.querySelectorAll('.category-btn');
        botones.forEach(btn => btn.classList.remove('active'));
        elemento.classList.add('active');

        aplicarFiltrosYBusqueda();
    }

    function filterRecipes() {
        aplicarFiltrosYBusqueda();
    }

    /* Buscador dinámico integrado en la vista de detalle */
    function filterRecipesDetail() {
        const textoBusqueda = document.getElementById('detailSearchInput').value.toLowerCase();
        const resultsContainer = document.getElementById('detail-quick-results');

        if (textoBusqueda.length >= 2) {
            const busquedaGlobal = recetas.filter(r => 
                r.titulo.toLowerCase().includes(textoBusqueda) || 
                r.ingredientes.some(i => i.toLowerCase().includes(textoBusqueda))
            );

            if (busquedaGlobal.length > 0) {
                resultsContainer.style.display = 'block';
                resultsContainer.innerHTML = busquedaGlobal.map(r => `
                    <div class="search-item" onclick="showRecipe(${r.id})">
                        <strong>${r.titulo}</strong>
                        <span style="font-size:11px; color:#999">${r.meta} (${r.categoria.join(', ')})</span>
                    </div>
                `).join('');
            } else {
                resultsContainer.innerHTML = '<div class="search-item">No hay resultados</div>';
            }
        } else {
            resultsContainer.style.display = 'none';
        }
    }

    function aplicarFiltrosYBusqueda() {
        const textoBusqueda = document.getElementById('searchInput').value.toLowerCase();
        const resultsContainer = document.getElementById('quick-results');

        let filtradas = recetas;
        if (categoriaActual !== 'Todas') {
            filtradas = recetas.filter(r => r.categoria.includes(categoriaActual));
        }

        if (textoBusqueda.length >= 2) {
            const busquedaGlobal = recetas.filter(r => 
                r.titulo.toLowerCase().includes(textoBusqueda) || 
                r.ingredientes.some(i => i.toLowerCase().includes(textoBusqueda))
            );

            if (busquedaGlobal.length > 0) {
                resultsContainer.style.display = 'block';
                resultsContainer.innerHTML = busquedaGlobal.map(r => `
                    <div class="search-item" onclick="showRecipe(${r.id})">
                        <strong>${r.titulo}</strong>
                        <span style="font-size:11px; color:#999">${r.meta} (${r.categoria.join(', ')})</span>
                    </div>
                `).join('');
            } else {
                resultsContainer.innerHTML = '<div class="search-item">No hay resultados</div>';
            }

            filtradas = filtradas.filter(r => 
                r.titulo.toLowerCase().includes(textoBusqueda) || 
                r.ingredientes.some(i => i.toLowerCase().includes(textoBusqueda))
            );
        } else {
            resultsContainer.style.display = 'none';
        }

        // 🌟 ORDENA DE MAYOR A MENOR ID (El número más alto primero, el 1 el último)
        filtradas.sort((a, b) => b.id - a.id);

        renderHome(filtradas);
    }

    function updateQuantities(recipeId) {
        const input = document.getElementById('servings-input');
        const newServings = parseFloat(input.value);
        const recipe = recetas.find(r => r.id === recipeId);
        const ratio = newServings / recipe.personas;

        const ingredientList = document.getElementById('ingredient-list');
        ingredientList.innerHTML = recipe.ingredientes.map(ing => {
            const updatedIng = ing.replace(/([0-9]+[.,]?[0-9]*)/g, (match) => {
                let num = parseFloat(match.replace(',', '.'));
                let finalNum = num * ratio;
                return Number.isInteger(finalNum) ? finalNum : finalNum.toFixed(1);
            });
            return `<li>${updatedIng}</li>`;
        }).join('');
    }

    function toggleStep(element) {
        element.classList.toggle('done');
    }

    function showRecipe(id) {
        toggleWakeLock(true); 
        const recipe = recetas.find(r => r.id === id);
        const detailView = document.getElementById('recipe-detail');
        const homeView = document.getElementById('home-view');
        const searchBox = document.getElementById('search-box');
        const categoriesBox = document.getElementById('categories-box');
        const content = document.getElementById('detail-content');
        const resultsContainer = document.getElementById('quick-results');
        const detailResultsContainer = document.getElementById('detail-quick-results');

        resultsContainer.style.display = 'none';
        if(detailResultsContainer) detailResultsContainer.style.display = 'none';
        
        // Limpiamos el buscador de detalle al cambiar de receta
        const detailInput = document.getElementById('detailSearchInput');
        if(detailInput) detailInput.value = '';

        homeView.style.display = 'none';
        searchBox.style.display = 'none';
        categoriesBox.style.display = 'none'; 
        detailView.style.display = 'block';

        content.innerHTML = `
            <div class="detail-header">
                <h2>${recipe.titulo}</h2>
                <div class="detail-meta">${recipe.meta} | ${recipe.categoria.join(', ')}</div>
            </div>

            <div class="servings-selector">
                Raciones: <input type="number" id="servings-input" value="${recipe.personas}" min="1" onchange="updateQuantities(${recipe.id})">
            </div>

            <div class="video-box">
                <iframe src="${recipe.video}" allowfullscreen></iframe>
            </div>
            <div class="content-split">
                <div class="ingredients">
                    <h3>Ingredientes</h3>
                    <ul id="ingredient-list">${recipe.ingredientes.map(i => `<li>${i}</li>`).join('')}</ul>
                </div>
                <div class="instructions">
                    <h3>Preparación (toca el número para marcar)</h3>
                    <ol>
                        ${recipe.pasos.map(p => `
                            <li onclick="toggleStep(this)">
                                ${p.texto}
                                ${p.foto ? `<img src="${p.foto}" class="step-img" alt="Paso detallado">` : ''}
                            </li>
                        `).join('')}
                    </ol>
                </div>
            </div>
        `;
        window.scrollTo(0,0);
    }

    // Cerrar cuadros de búsqueda al hacer clic fuera de ellos
    document.addEventListener('click', function(e) {
        if (!document.getElementById('search-box').contains(e.target)) {
            document.getElementById('quick-results').style.display = 'none';
        }
        if (document.getElementById('detail-search-box') && !document.getElementById('detail-search-box').contains(e.target)) {
            document.getElementById('detail-quick-results').style.display = 'none';
        }
    });

    document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible' && document.getElementById('recipe-detail').style.display === 'block') {
            wakeLock = await navigator.wakeLock.request('screen');
        }
    });

    // 🌟 SE CAMBIA EL RENDER DIRECTO POR LA FUNCIÓN PARA QUE ORDENE DESDE EL INICIO
    aplicarFiltrosYBusqueda();
</script>
