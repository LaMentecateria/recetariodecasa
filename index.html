<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetario de casa</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #333;
            --accent: #000;
            --grey: #999;
            --light-grey: #f4f4f4;
            --highlight: #fff5ad; 
        }

        body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
        
        header { 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 60px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .brand-container { cursor: pointer; }
        header h1 { font-size: 32px; font-weight: 200; letter-spacing: -1px; margin: 0; }
        header p { margin: 5px 0 0 0; font-size: 12px; color: var(--grey); text-transform: uppercase; letter-spacing: 2px; }

        .search-container { position: relative; }
        .search-input {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 16px; 
            outline: none;
            width: 200px;
            transition: all 0.3s;
            -webkit-appearance: none;
        }
        .search-input:focus { width: 250px; border-color: var(--accent); }

        .search-results-list {
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            width: 250px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            z-index: 100;
            display: none;
            margin-top: 5px;
        }
        .search-item {
            padding: 12px 15px;
            border-bottom: 1px solid #f9f9f9;
            cursor: pointer;
            font-size: 14px;
            display: block;
            color: var(--text);
            text-decoration: none;
        }
        .search-item:last-child { border-bottom: none; }
        .search-item:hover { background: var(--light-grey); }
        .search-item strong { display: block; color: var(--accent); }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

        .recipe-grid-home { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; padding-bottom: 60px; }
        .recipe-card { border: 1px solid #eee; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; background: #fff; }
        .recipe-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        
        .recipe-card-img { width: 100%; height: 200px; object-fit: cover; border-bottom: 1px solid #eee; }
        .recipe-card-info { padding: 20px; }
        .recipe-card-info h2 { font-size: 20px; margin: 0 0 10px; color: #111; }
        .recipe-card-info .meta { font-size: 11px; color: var(--grey); text-transform: uppercase; letter-spacing: 1px; }

        #recipe-detail { display: none; padding-bottom: 100px; }
        .back-btn { background: none; border: 1px solid #ddd; padding: 8px 15px; cursor: pointer; font-size: 12px; text-transform: uppercase; margin-bottom: 40px; }
        .back-btn:hover { background: #000; color: #fff; }

        .detail-header h2 { font-size: 42px; font-weight: 700; margin: 0 0 10px; letter-spacing: -1px; }
        .detail-meta { font-size: 13px; color: var(--grey); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 40px; }
        
        .servings-selector { margin-bottom: 20px; font-size: 14px; font-weight: bold; }
        .servings-selector input { width: 50px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; margin-left: 10px; }

        .video-box { position: relative; padding-bottom: 56.25%; height: 0; background: #000; margin-bottom: 50px; }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .content-split { display: flex; flex-wrap: wrap; gap: 60px; }
        .ingredients { flex: 0 0 240px; }
        .instructions { flex: 1 1 300px; }

        h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #ccc; margin-bottom: 25px; }
        ul, ol { padding: 0; list-style: none; margin: 0; }
        .ingredients li { font-size: 16px; padding: 10px 0; border-bottom: 1px solid #f2f2f2; }
        
        ol { counter-reset: steps; }
        ol li { position: relative; padding-left: 45px; margin-bottom: 30px; font-size: 18px; line-height: 1.6; transition: background 0.3s; }
        
        ol li.done { background-color: var(--highlight); border-radius: 4px; }

        ol li::before { 
            content: counter(steps); counter-increment: steps;
            position: absolute; left: 0; top: 4px;
            width: 24px; height: 24px; background: #000; color: #fff;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: bold; cursor: pointer;
        }

        .timer-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 12px;
            background: #fff;
            border: 1px solid #000;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .timer-btn:hover { background: #000; color: #fff; }

        .step-img {
            width: 100%;
            max-width: 450px;
            border-radius: 8px;
            margin: 15px 0 10px 0;
            display: block;
            border: 1px solid #eee;
        }

        @media (max-width: 600px) { 
            .content-split { flex-direction: column; } 
            header { text-align: center; justify-content: center; padding: 40px 20px; }
            .search-results-list { width: calc(100vw - 40px); right: -10px; left: -10px; margin: 5px auto; }
        }
    </style>
</head>
<body>

<header>
    <div class="brand-container" onclick="showHome()">
        <h1>Recetario de casa</h1>
        <p>Nuestra historia a fuego lento</p>
    </div>
    <div class="search-container" id="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar ingrediente o receta..." onkeyup="filterRecipes()" autocomplete="off">
        <div id="quick-results" class="search-results-list"></div>
    </div>
</header>

<div class="container">
    <div id="home-view" class="recipe-grid-home"></div>
    <div id="recipe-detail">
        <button class="back-btn" onclick="showHome()">← Volver al recetario</button>
        <div id="detail-content"></div>
    </div>
</div>

<script>

        {
            "id": 6,

            "imagen": "images/espaguetisnata.png",

            "ingredientes": ["400g espaguetis", "200ml nata", "1 pechuga pollo", "100g bacon", "2 latas atún", "1 cebolla", "150g champiñones", "Aceite, sal y pimienta"], 
            "pasos": [
                { "texto": "Cocer los espaguetis al dente.", "foto": "" },
                { "texto": "Picar cebolla y limpiar champiñones.", "foto": "" },

    ];

    let wakeLock = null;

    async function toggleWakeLock(activate) {
        if (!('wakeLock' in navigator)) return;
        try {
            if (activate) {
                wakeLock = await navigator.wakeLock.request('screen');
            } else if (wakeLock && wakeLock.release) {
                await wakeLock.release();
                wakeLock = null;
            }
        } catch (err) {}
    }

    // --- NUEVA FUNCIÓN: TEMPORIZADOR CON NOTIFICACIÓN ---
    function setTimer(minutes, stepText) {
        if (!("Notification" in window)) {
            alert("Tu navegador no soporta notificaciones.");
            return;
        }

        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                alert(`Temporizador activado: Te avisaré en ${minutes} min. Puedes bloquear el móvil.`);
                setTimeout(() => {
                    new Notification("🍳 Recetario: ¡Tiempo cumplido!", {
                        body: `Han pasado ${minutes} min: ${stepText.substring(0, 50)}...`,
                        vibrate: [200, 100, 200]
                    });
                }, minutes * 60000);
            }
        });
    }

    function detectTime(text) {
        const match = text.match(/(\d+)\s*(minutos|min|hora|horas)/i);
        if (match) {
            let mins = parseInt(match[1]);
            if (match[2].toLowerCase().includes("hora")) mins *= 60;
            return mins;
        }
        return null;
    }

    function showHome() {
        toggleWakeLock(false);
        document.getElementById('home-view').style.display = 'grid';
        document.getElementById('recipe-detail').style.display = 'none';
        document.getElementById('search-box').style.display = 'block';
        document.getElementById('quick-results').style.display = 'none';
        document.getElementById('searchInput').value = '';
        renderHome(recetas);
    }

    function renderHome(listaRecetas) {
        const homeView = document.getElementById('home-view');
        homeView.innerHTML = listaRecetas.map(r => `
            <div class="recipe-card" onclick="showRecipe(${r.id})">
                <img src="${r.imagen}" class="recipe-card-img" alt="${r.titulo}">
                <div class="recipe-card-info">
                    <div class="meta">${r.meta}</div>
                    <h2>${r.titulo}</h2>
                </div>
            </div>
        `).join('');
    }

    function filterRecipes() {
        const text = document.getElementById('searchInput').value.toLowerCase();
        const resultsContainer = document.getElementById('quick-results');
        if (text.length < 2) { resultsContainer.style.display = 'none'; renderHome(recetas); return; }
        const filtradas = recetas.filter(r => r.titulo.toLowerCase().includes(text) || r.ingredientes.some(i => i.toLowerCase().includes(text)));
        resultsContainer.style.display = 'block';
        resultsContainer.innerHTML = filtradas.length ? filtradas.map(r => `<div class="search-item" onclick="showRecipe(${r.id})"><strong>${r.titulo}</strong><span style="font-size:11px; color:#999">${r.meta}</span></div>`).join('') : '<div class="search-item">No hay resultados</div>';
        renderHome(filtradas);
    }

    function updateQuantities(recipeId) {
        const newServings = parseFloat(document.getElementById('servings-input').value);
        const recipe = recetas.find(r => r.id === recipeId);
        const ratio = newServings / recipe.personas;
        document.getElementById('ingredient-list').innerHTML = recipe.ingredientes.map(ing => {
            const updated = ing.replace(/([0-9]+[.,]?[0-9]*)/g, (match) => {
                let finalNum = parseFloat(match.replace(',', '.')) * ratio;
                return Number.isInteger(finalNum) ? finalNum : finalNum.toFixed(1);
            });
            return `<li>${updated}</li>`;
        }).join('');
    }

    function toggleStep(element) { element.classList.toggle('done'); }

    function showRecipe(id) {
        toggleWakeLock(true);
        const recipe = recetas.find(r => r.id === id);
        document.getElementById('home-view').style.display = 'none';
        document.getElementById('search-box').style.display = 'none';
        document.getElementById('recipe-detail').style.display = 'block';
        
        document.getElementById('detail-content').innerHTML = `
            <div class="detail-header"><h2>${recipe.titulo}</h2><div class="detail-meta">${recipe.meta}</div></div>
            <div class="servings-selector">Raciones: <input type="number" id="servings-input" value="${recipe.personas}" min="1" onchange="updateQuantities(${recipe.id})"></div>
            <div class="video-box"><iframe src="${recipe.video}" allowfullscreen></iframe></div>
            <div class="content-split">
                <div class="ingredients"><h3>Ingredientes</h3><ul id="ingredient-list">${recipe.ingredientes.map(i => `<li>${i}</li>`).join('')}</ul></div>
                <div class="instructions"><h3>Preparación</h3><ol>
                    ${recipe.pasos.map(p => {
                        const mins = detectTime(p.texto);
                        return `<li onclick="toggleStep(this)">
                            ${p.texto}
                            ${mins ? `<br><button class="timer-btn" onclick="event.stopPropagation(); setTimer(${mins}, '${p.texto.replace(/'/g, "\\'")}')">🔔 Avisar en ${mins} min</button>` : ''}
                            ${p.foto ? `<img src="${p.foto}" class="step-img">` : ''}
                        </li>`;
                    }).join('')}
                </ol></div>
            </div>
        `;
        window.scrollTo(0,0);
    }

    document.addEventListener('click', (e) => { if (!document.getElementById('search-box').contains(e.target)) document.getElementById('quick-results').style.display = 'none'; });
    document.addEventListener('visibilitychange', async () => { if (wakeLock !== null && document.visibilityState === 'visible' && document.getElementById('recipe-detail').style.display === 'block') wakeLock = await navigator.wakeLock.request('screen'); });
    renderHome(recetas);
</script>
</body>
</html>
